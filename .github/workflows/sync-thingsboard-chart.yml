name: Sync and Publish ThingsBoard Helm Chart

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-thingsboard-chart
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/thingsboard/thingsboard-ce-k8s.git
  UPSTREAM_BRANCH: master
  UPSTREAM_CHART_PATH: helm/thingsboard
  LOCAL_CHART_PATH: charts/thingsboard
  PAGES_DIR: docs
  CHART_NAME: thingsboard
  REPO_URL: https://xlight.github.io/thingsboard-helm-mirror
  HELM_VERSION: v3.15.4
  YQ_VERSION: v4.44.3

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install yq and jq
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
          sudo apt-get update
          sudo apt-get install -y jq
          yq --version
          jq --version

      - name: Clone upstream chart
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream-thingsboard
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" "${UPSTREAM_REPO}" /tmp/upstream-thingsboard
          test -d "/tmp/upstream-thingsboard/${UPSTREAM_CHART_PATH}"

      - name: Sync chart sources
        run: |
          set -euo pipefail
          mkdir -p "${LOCAL_CHART_PATH}"
          rm -rf "${LOCAL_CHART_PATH}"
          mkdir -p "$(dirname "${LOCAL_CHART_PATH}")"
          cp -R "/tmp/upstream-thingsboard/${UPSTREAM_CHART_PATH}" "${LOCAL_CHART_PATH}"

      - name: Detect source changes
        id: detect_changes
        run: |
          set -euo pipefail

          CHART_SOURCE_CHANGED="false"
          if ! git diff --quiet -- "${LOCAL_CHART_PATH}"; then
            CHART_SOURCE_CHANGED="true"
          fi

          PUBLISH_ARTIFACTS_MISSING="false"
          if [ ! -f "${PAGES_DIR}/index.yaml" ] || ! find "${PAGES_DIR}" -maxdepth 1 -type f -name "${CHART_NAME}-*.tgz" | grep -q .; then
            PUBLISH_ARTIFACTS_MISSING="true"
          fi

          if [ "${CHART_SOURCE_CHANGED}" = "true" ] || [ "${PUBLISH_ARTIFACTS_MISSING}" = "true" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "chart_source_changed=${CHART_SOURCE_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "publish_artifacts_missing=${PUBLISH_ARTIFACTS_MISSING}" >> "${GITHUB_OUTPUT}"

      - name: Stop early when no chart changes
        if: steps.detect_changes.outputs.changed != 'true'
        run: |
          echo "No upstream chart changes detected and publish artifacts already exist. Skipping publish."

      - name: Prepare docs directory
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${PAGES_DIR}"

      - name: Resolve chart version
        if: steps.detect_changes.outputs.changed == 'true'
        id: chart_version
        run: |
          set -euo pipefail

          CHART_FILE="${LOCAL_CHART_PATH}/Chart.yaml"
          BASE_VERSION="$(yq -r '.version' "${CHART_FILE}")"

          if [ -z "${BASE_VERSION}" ] || [ "${BASE_VERSION}" = "null" ]; then
            echo "Chart.yaml version is missing"
            exit 1
          fi

          if [ -f "${PAGES_DIR}/index.yaml" ]; then
            EXISTING_VERSIONS="$(yq -r '.entries["'"${CHART_NAME}"'"][].version // ""' "${PAGES_DIR}/index.yaml" 2>/dev/null || true)"
          else
            EXISTING_VERSIONS=""
          fi

          CURRENT_PACKAGES="$(find "${PAGES_DIR}" -maxdepth 1 -type f -name "${CHART_NAME}-*.tgz" -print 2>/dev/null || true)"

          TARGET_VERSION="${BASE_VERSION}"

          if [ "${{ steps.detect_changes.outputs.chart_source_changed }}" = "true" ]; then
            if printf '%s\n' "${EXISTING_VERSIONS}" | grep -Fxq "${BASE_VERSION}"; then
              NEXT_SUFFIX=1
              while printf '%s\n' "${EXISTING_VERSIONS}" | grep -Fxq "${BASE_VERSION}-${NEXT_SUFFIX}"; do
                NEXT_SUFFIX=$((NEXT_SUFFIX + 1))
              done
              TARGET_VERSION="${BASE_VERSION}-${NEXT_SUFFIX}"
            fi
          else
            if [ "${{ steps.detect_changes.outputs.publish_artifacts_missing }}" = "true" ] && printf '%s\n' "${EXISTING_VERSIONS}" | grep -Fxq "${BASE_VERSION}"; then
              if printf '%s\n' "${CURRENT_PACKAGES}" | grep -Fq "${CHART_NAME}-${BASE_VERSION}.tgz"; then
                TARGET_VERSION="${BASE_VERSION}-1"
              else
                TARGET_VERSION="${BASE_VERSION}"
              fi
            fi
          fi

          yq -i '.version = "'"${TARGET_VERSION}"'"' "${CHART_FILE}"

          echo "base_version=${BASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "target_version=${TARGET_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Try to build chart dependencies from upstream repositories
        if: steps.detect_changes.outputs.changed == 'true'
        id: dependency_update
        continue-on-error: true
        run: |
          set -euo pipefail
          helm dependency update "${LOCAL_CHART_PATH}"

      - name: Vendor fallback dependencies when upstream versions are unavailable
        if: steps.detect_changes.outputs.changed == 'true' && steps.dependency_update.outcome == 'failure'
        run: |
          set -euo pipefail

          CHART_FILE="${LOCAL_CHART_PATH}/Chart.yaml"
          mkdir -p "${LOCAL_CHART_PATH}/charts"

          while IFS=$'\t' read -r NAME VERSION REPOSITORY CONDITION; do
            if [ -z "${NAME}" ] || [ "${NAME}" = "null" ]; then
              continue
            fi

            if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
              echo "Dependency version is missing for ${NAME}"
              exit 1
            fi

            if [ -z "${REPOSITORY}" ] || [ "${REPOSITORY}" = "null" ]; then
              echo "Dependency repository is missing for ${NAME}"
              exit 1
            fi

            helm repo add "${NAME}-repo" "${REPOSITORY}" --force-update >/dev/null 2>&1 || helm repo add "${NAME}-repo" "${REPOSITORY}"
            helm repo update >/dev/null 2>&1 || true

            AVAILABLE_VERSION="$(helm search repo "${NAME}-repo/${NAME}" --versions -o json | jq -r '.[0].version // ""')"

            if [ -z "${AVAILABLE_VERSION}" ]; then
              echo "No versions available for dependency ${NAME} from ${REPOSITORY}"
              exit 1
            fi

            helm pull "${NAME}-repo/${NAME}" --version "${AVAILABLE_VERSION}" --destination "${LOCAL_CHART_PATH}/charts"

            yq -i '
              (.dependencies[] | select(.name == "'"${NAME}"'") | .version) = "'"${AVAILABLE_VERSION}"'" |
              (.dependencies[] | select(.name == "'"${NAME}"'") | .repository) = "'"${REPOSITORY}"'"
            ' "${CHART_FILE}"
          done < <(yq -r '.dependencies[] | [.name, .version, .repository, (.condition // "")] | @tsv' "${CHART_FILE}")

      - name: Build chart metadata
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          helm dependency build "${LOCAL_CHART_PATH}"

      - name: Lint chart
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          helm lint "${LOCAL_CHART_PATH}" \
            --set kafka.zookeeper.containerPorts.client=2181 \
            --set kafka.service.ports.client=9092

      - name: Package chart
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          helm package "${LOCAL_CHART_PATH}" --destination "${PAGES_DIR}"

      - name: Generate Helm repository index
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ -f "${PAGES_DIR}/index.yaml" ]; then
            helm repo index "${PAGES_DIR}" \
              --url "${REPO_URL}" \
              --merge "${PAGES_DIR}/index.yaml"
          else
            helm repo index "${PAGES_DIR}" \
              --url "${REPO_URL}"
          fi

      - name: Commit and push changes
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${LOCAL_CHART_PATH}" "${PAGES_DIR}"

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          TARGET_VERSION="${{ steps.chart_version.outputs.target_version }}"
          git commit -m "chore: sync ${CHART_NAME} chart to ${TARGET_VERSION}"
          git push